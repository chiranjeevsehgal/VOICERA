services:
  backend:
    image: voicera/voicera-backend:latest
    container_name: voicera-backend
    ports:
      - "0.0.0.0:8000:8000"
    env_file:
      - .env
    environment:
      - TRUST_CLIENT_IP_HEADER=true
    command: python main.py
    restart: unless-stopped

networks:
  default:
    name: voicera-network