events {
    worker_connections 1024;
}

http {
    upstream voicera_backend {
        # Use the Docker Compose service name for DNS resolution
        server backend:8000;
    }

    server {
        listen 8000;
        server_name localhost;

        # Increase client max body size for file uploads
        client_max_body_size 50M;

        # Proxy configuration
        location / {
            proxy_pass http://voicera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Forward client-provided IP header (if present) and optional token
            proxy_set_header X-Client-IP $http_x_client_ip;
            proxy_set_header X-Client-IP-Token $http_x_client_ip_token;
            
            # WebSocket support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint (direct to nginx)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
