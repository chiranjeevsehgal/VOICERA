<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>VOICERA - New Contact Form Submission</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <style>
      /* Reset styles */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0 !important;
        padding: 0 !important;
        background: #f8fafc !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif !important;
        width: 100% !important;
        min-width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      /* Container and table styles */
      .email-container {
        width: 100% !important;
        max-width: 650px !important;
        margin: 0 auto !important;
      }

      table {
        border-collapse: collapse !important;
        mso-table-lspace: 0pt !important;
        mso-table-rspace: 0pt !important;
      }

      td {
        border-collapse: collapse !important;
      }

      .container {
        width: 100% !important;
        max-width: 650px !important;
        margin: 20px auto !important;
        background: #ffffff !important;
        border-radius: 12px !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1) !important;
        overflow: hidden !important;
        border: 1px solid #e2e8f0 !important;
      }

      .header {
        background: linear-gradient(135deg, #3949ab 0%, #303f9f 100%) !important;
        padding: 24px !important;
        color: white !important;
        text-align: center !important;
      }

      .header-content {
        position: relative !important;
        z-index: 1 !important;
      }

      .logo {
        font-size: 20px !important;
        font-weight: 700 !important;
        margin-bottom: 4px !important;
        line-height: 1.2 !important;
      }

      .alert-title {
        font-size: 24px !important;
        font-weight: 600 !important;
        margin-bottom: 8px !important;
        line-height: 1.2 !important;
      }

      .alert-subtitle {
        font-size: 14px !important;
        opacity: 0.9 !important;
        font-weight: 400 !important;
        line-height: 1.4 !important;
      }

      .content {
        padding: 32px 24px !important;
        color: #334155 !important;
        font-size: 15px !important;
        line-height: 1.6 !important;
      }

      .timestamp {
        background: #f0f4ff !important;
        border-left: 4px solid #3949ab !important;
        padding: 16px !important;
        margin-bottom: 24px !important;
        border-radius: 0 8px 8px 0 !important;
      }

      .timestamp strong {
        color: #3949ab !important;
        font-size: 16px !important;
      }

      .contact-section {
        background: #fafafa !important;
        border-radius: 8px !important;
        padding: 20px !important;
        margin: 16px 0 !important;
        border: 1px solid #e5e7eb !important;
      }

      .contact-section h3 {
        margin: 0 0 12px 0 !important;
        color: #1f2937 !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        line-height: 1.3 !important;
      }

      .contact-field {
        margin-bottom: 12px !important;
      }

      .field-label {
        font-weight: 600 !important;
        color: #374151 !important;
        display: inline-block !important;
        min-width: 120px !important;
      }

      .field-value {
        color: #6b7280 !important;
      }

      .message-content {
        background: #f9fafb !important;
        padding: 16px !important;
        border-radius: 8px !important;
        border: 1px solid #e5e7eb !important;
        color: #374151 !important;
        white-space: pre-wrap !important;
        word-wrap: break-word !important;
        line-height: 1.6 !important;
        margin-top: 8px !important;
      }

      .footer {
        background: #f8fafc !important;
        text-align: center !important;
        padding: 20px !important;
        font-size: 12px !important;
        color: #6b7280 !important;
        border-top: 1px solid #e5e7eb !important;
      }

      .footer a {
        color: #3949ab !important;
        text-decoration: none !important;
      }

      /* Mobile styles */
      @media only screen and (max-width: 640px) {
        .container {
          margin: 10px auto !important;
          border-radius: 8px !important;
          width: 95% !important;
        }

        .header {
          padding: 20px 16px !important;
        }

        .alert-title {
          font-size: 20px !important;
        }

        .content {
          padding: 24px 16px !important;
        }

        .contact-section {
          padding: 16px !important;
          margin: 12px 0 !important;
        }

        .field-label {
          min-width: 100px !important;
          display: block !important;
          margin-bottom: 4px !important;
        }

        .timestamp {
          padding: 12px !important;
        }

        .footer {
          padding: 16px !important;
        }
      }

      @media only screen and (max-width: 480px) {
        .container {
          width: 98% !important;
          margin: 5px auto !important;
        }

        .content {
          padding: 20px 12px !important;
          font-size: 14px !important;
        }

        .contact-section {
          padding: 12px !important;
        }

        .message-content {
          padding: 12px !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="email-container">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
        <tr>
          <td>
            <div class="container">
              <!-- Header -->
              <div class="header">
                <div class="header-content">
                  <div class="logo">TRIXLABS CONTACT ALERT</div>
                  <div class="alert-subtitle">Someone reached out via your website</div>
                </div>
              </div>

              <!-- Content -->
              <div class="content">
                <!-- Timestamp -->
                <div class="timestamp">
                  <strong>Received:</strong> {{timestamp}} ({{timezone}})
                </div>

                <!-- Contact Details -->
                <div class="contact-section">
                  <h3>👤 Contact Information</h3>
                  <div class="contact-field">
                    <span class="field-label">Name:</span>
                    <span class="field-value">{{name}}</span>
                  </div>
                  <div class="contact-field">
                    <span class="field-label">Email:</span>
                    <span class="field-value">{{email}}</span>
                  </div>
                  <div class="contact-field">
                    <span class="field-label">Phone:</span>
                    <span class="field-value">{{phone_number}}</span>
                  </div>
                </div>

                <!-- Message -->
                <div class="contact-section">
                  <h3>💬 Message</h3>
                  <div class="message-content">{{message}}</div>
                </div>

              </div>

              <!-- Footer -->
              <div class="footer">
                <p>
                  This contact form submission was received from your TrixLabs website.
                </p>
              </div>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
