<div class="card flex justify-center">
  <p-toast
    [breakpoints]="{ '640px': { width: '90vw', right: '5vw', left: '5vw' } }"
  />
</div>

<!-- Mobile Overlay -->
<div
  *ngIf="isMobile && isOpen"
  class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden transition-opacity duration-300"
  (click)="closeSidebar()"
></div>

<!-- Sidebar -->
<nav
  class="fixed top-0 left-0 h-full bg-white shadow-2xl z-50 transform transition-all duration-300 ease-in-out border-r border-gray-100 overflow-hidden flex flex-col"
  [ngClass]="{
    'translate-x-0': isOpen || !isMobile,
    '-translate-x-full': !isOpen && isMobile,
    'w-64': !isMobile,
    'w-72': isMobile
  }"
>
  <!-- Sidebar Header -->
  <div
    class="h-16 sm:h-20 flex items-center justify-between px-4 sm:px-6 border-b border-gray-100 bg-gradient-to-r from-indigo-600 via-purple-600 to-blue-700 relative overflow-hidden flex-shrink-0"
  >
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
      <div
        class="absolute top-0 right-0 w-32 h-32 bg-white rounded-full transform translate-x-16 -translate-y-16"
      ></div>
      <div
        class="absolute bottom-0 left-0 w-24 h-24 bg-white rounded-full transform -translate-x-12 translate-y-12"
      ></div>
    </div>

    <div class="flex items-center space-x-3 relative z-10">
      <!-- Logo Icon -->
      <div
        class="flex items-center justify-center h-8 w-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg p-1.5"
      >
        <div class="flex items-end space-x-0.5">
          <div class="w-0.5 h-2 bg-white rounded-full"></div>
          <div class="w-0.5 h-4 bg-white rounded-full"></div>
          <div class="w-0.5 h-3 bg-white rounded-full"></div>
          <div class="w-0.5 h-5 bg-white rounded-full"></div>
          <div class="w-0.5 h-2 bg-white rounded-full"></div>
        </div>
      </div>
      <div class="text-white">
        <h1 class="text-lg sm:text-xl font-black tracking-tight">VOICERA</h1>
        <p class="text-xs sm:text-sm text-white/80 font-medium">
          Admin Dashboard
        </p>
      </div>
    </div>

    <!-- Close Button (Mobile Only) -->
    <button
      *ngIf="isMobile"
      (click)="closeSidebar()"
      class="w-8 h-8 bg-white/20 backdrop-blur-sm rounded-lg cursor-pointer flex items-center justify-center text-white hover:bg-white/30 transition-all duration-200 border border-white/30 hover:scale-105 relative z-10"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <!-- Navigation Menu (Scrollable Area) -->
  <div
    class="flex-1 overflow-y-auto py-4 sm:py-6 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100"
  >
    <div class="px-3 sm:px-4 space-y-1 sm:space-y-2">
      <ng-container *ngFor="let item of sidebarItems; trackBy: trackByFn">
        <button
          (click)="selectItem(item.id)"
          class="w-full group flex cursor-pointer items-center px-3 sm:px-4 py-2.5 sm:py-3 text-sm sm:text-base font-medium rounded-xl transition-all duration-200 text-left relative overflow-hidden hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:ring-offset-2"
          [ngClass]="{
            'bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-lg transform scale-[1.02] shadow-indigo-500/25':
              item.active,
            'text-gray-600 hover:text-indigo-600 hover:bg-gradient-to-r hover:from-indigo-50 hover:to-purple-50 hover:border-indigo-200':
              !item.active
          }"
        >
          <!-- Active Background Glow -->
          <div
            *ngIf="item.active"
            class="absolute inset-0 bg-gradient-to-r from-indigo-400/20 to-purple-400/20 rounded-xl blur-sm"
          ></div>

          <!-- Icon Container -->
          <div class="flex-shrink-0 mr-3 relative z-10">
            <div
              class="w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center rounded-lg transition-all duration-200 group-hover:scale-110"
              [ngClass]="{
                'text-white drop-shadow-sm': item.active,
                'text-gray-400 group-hover:text-indigo-500': !item.active
              }"
            >
              <lucide-icon
                [img]="item.icon"
                class="w-full h-full"
              ></lucide-icon>
            </div>
          </div>

          <!-- Label -->
          <span
            class="flex-1 truncate relative z-10 font-semibold group-hover:translate-x-1 transition-transform duration-200"
          >
            {{ item.label }}
          </span>

          <!-- Badge -->
          <div
            *ngIf="item.badge"
            class="ml-2 px-2 py-0.5 text-xs font-bold rounded-full transition-all duration-200 relative z-10 min-w-[20px] text-center shadow-sm"
            [ngClass]="{
              'bg-white/20 text-white backdrop-blur-sm border border-white/30':
                item.active,
              'bg-indigo-100 text-indigo-700 group-hover:bg-indigo-200 border border-indigo-200':
                !item.active
            }"
          >
            {{ item.badge }}
          </div>

          <!-- Active Indicator -->
          <div
            *ngIf="item.active"
            class="ml-2 w-2 h-2 bg-white rounded-full animate-pulse shadow-sm relative z-10"
          ></div>

          <!-- Hover Effect Line -->
          <div
            *ngIf="!item.active"
            class="absolute left-0 top-1/2 w-1 h-0 bg-gradient-to-b from-indigo-500 to-purple-500 rounded-r-full transition-all duration-200 group-hover:h-8 transform -translate-y-1/2"
          ></div>
        </button>
      </ng-container>
    </div>
  </div>

  <!-- Sidebar Footer -->
  <div
    class="border-t border-gray-100 p-4 sm:p-6 bg-gradient-to-br from-gray-50/50 to-indigo-50/50 flex-shrink-0 mt-auto"
  >
    <!-- Logout Button -->
    <button
      (click)="onSignOut()"
      class="w-full px-4 py-2.5 cursor-pointer text-sm font-medium text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all duration-200 flex items-center justify-center space-x-2 border border-gray-200 hover:border-red-200 hover:shadow-md group"
    >
      <svg
        class="w-4 h-4 transition-transform duration-200 group-hover:scale-110"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        />
      </svg>
      <span>Logout</span>
    </button>
  </div>
</nav>
