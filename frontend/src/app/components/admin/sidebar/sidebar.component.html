<!-- Mobile Overlay -->
@if (isMobile && isOpen) {
  <div
    class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden transition-opacity duration-300"
    (click)="closeSidebar()"
  ></div>
}

<!-- Sidebar -->
<nav
  role="navigation"
  aria-label="Admin sidebar"
  class="fixed top-0 left-0 h-full bg-white shadow-sm z-50 transform transition-all duration-300 ease-in-out border-r border-gray-200 overflow-hidden flex flex-col"
  [ngClass]="{
    'translate-x-0': isOpen || !isMobile,
    '-translate-x-full': !isOpen && isMobile,
    'w-64': !isMobile,
    'w-72': isMobile,
  }"
  >
  <!-- Sidebar Header -->
  <div
    class="h-16 sm:h-20 flex items-center justify-between px-4 sm:px-6 border-b border-gray-200 bg-white relative flex-shrink-0"
    >
    <div class="flex items-center space-x-3 relative z-10">
      <!-- Logo Icon -->
      <img src="logo.svg" alt="VOICERA" class="w-6 h-6" />
      <div class="text-gray-900">
        <h1 class="text-lg sm:text-xl font-bold tracking-tight">VOICERA</h1>
        <p class="text-xs sm:text-sm text-gray-500 font-medium">
          Admin Dashboard
        </p>
      </div>
    </div>

    <!-- Close Button (Mobile Only) -->
    @if (isMobile) {
      <button
        (click)="closeSidebar()"
        class="w-8 h-8 bg-white rounded-lg cursor-pointer flex items-center justify-center text-gray-600 hover:bg-gray-50 transition-colors border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 relative z-10"
        >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      }
    </div>

    <!-- Navigation Menu (Scrollable Area) -->
    <div
      class="flex-1 overflow-y-auto py-4 sm:py-6 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100"
      >
      <div class="px-3 sm:px-4 space-y-1 sm:space-y-2">
        @for (item of sidebarItems; track trackByFn($index, item)) {
          <button
            (click)="selectItem(item.id)"
            class="w-full group flex cursor-pointer items-center px-3 sm:px-4 py-2.5 sm:py-3 text-sm sm:text-base font-medium rounded-xl transition-colors duration-200 text-left focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-transparent"
          [ngClass]="{
            'bg-indigo-600 text-white': item.active,
            'text-gray-700 hover:text-indigo-700 hover:bg-gray-50':
              !item.active,
          }"
            [attr.aria-current]="item.active ? 'page' : null"
            >
            <!-- Icon Container -->
            <div class="flex-shrink-0 mr-3">
              <div
                class="w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center rounded-lg"
              [ngClass]="{
                'text-white': item.active,
                'text-gray-400 group-hover:text-indigo-600': !item.active,
              }"
                >
                @if (item.icon) {
                  <svg
                    [lucideIcon]="item.icon"
                    class="w-full h-full"
                  ></svg>
                } @else {
                  @if (item.iconName) {
                    <svg
                      [lucideIcon]="item.iconName"
                      class="w-full h-full"
                    ></svg>
                  }
                }
              </div>
            </div>
            <!-- Label -->
            <span class="flex-1 truncate font-semibold">
              {{ item.label }}
            </span>
            <!-- Badge -->
            @if (item.badge) {
              <div
                class="ml-2 px-2 py-0.5 text-xs font-bold rounded-full transition-colors min-w-[20px] text-center"
            [ngClass]="{
              'bg-white/30 text-white': item.active,
              'bg-indigo-100 text-indigo-700 group-hover:bg-indigo-200':
                !item.active,
            }"
                >
                {{ item.badge }}
              </div>
            }
          </button>
        }
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div
      class="border-t border-gray-200 p-4 sm:p-6 bg-white flex-shrink-0 mt-auto"
      >
      <!-- Logout Button -->
      <button
        (click)="onSignOut()"
        class="w-full px-4 py-2.5 cursor-pointer text-sm font-medium text-gray-700 bg-white rounded-xl transition-colors duration-200 flex items-center justify-center space-x-2 border border-gray-200 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </nav>
