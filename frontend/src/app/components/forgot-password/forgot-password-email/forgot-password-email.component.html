<div class="flex flex-col items-center justify-center min-h-screen bg-gray-50 p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
        <!-- Fingerprint Icon -->
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 bg-white flex items-center justify-center rounded-2xl shadow-2xl border-gray-800">
                <lucide-angular [name]="fingerPrint" class="h-10 w-10 px-0.5"></lucide-angular>
            </div>
        </div>

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-center text-gray-900 mb-2">Forgot password?</h1>
        <p class="text-center text-gray-600 mb-6">No worries, we'll send you reset instructions.</p>

        <!-- Form -->
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
            <!-- Email Field -->
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" formControlName="email" placeholder="Enter your email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-black"
                    [ngClass]="{'border-red-500': forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched}">
                <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
                    class="mt-1 text-sm text-red-500">
                    <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email is required</span>
                    <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Please enter a valid email</span>
                </div>
            </div>

            <!-- Reset Button -->
            <button type="submit"
                class="w-full bg-black cursor-pointer text-white font-medium py-2 px-4 rounded-md transition-colors mb-4"
                [disabled]="isSubmitting">
                <span *ngIf="isSubmitting" class="inline-block mr-2">
                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </span>
                <span>{{ isSubmitting ? 'Sending' : 'Reset password' }}</span>
            </button>

            <!-- Back to Login Link -->
            <div class="text-center">
                <a routerLink="/login" class="inline-flex items-center text-sm text-gray-600 hover:text-gray-900">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to log in
                </a>
            </div>
        </form>
    </div>
</div>
