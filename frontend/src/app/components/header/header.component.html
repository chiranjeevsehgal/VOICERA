<header class="border-b border-gray-200 py-3 px-4 bg-white">
  <div class="container mx-auto flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <!-- Sound Wave Logo -->
      <div
        class="flex items-center justify-center h-8 w-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg p-1.5"
      >
        <div class="flex items-end space-x-0.5">
          <div class="w-0.5 h-2 bg-white rounded-full"></div>
          <div class="w-0.5 h-4 bg-white rounded-full"></div>
          <div class="w-0.5 h-3 bg-white rounded-full"></div>
          <div class="w-0.5 h-5 bg-white rounded-full"></div>
          <div class="w-0.5 h-2 bg-white rounded-full"></div>
        </div>
      </div>
      <span class="font-bold text-lg text-gray-800">VOICERA</span>
    </div>

    <div class="flex items-center space-x-3">
      <!-- Library Button - Secondary Style -->
      <button
        (click)="onLibraryClick()"
        class="flex items-center space-x-2 bg-gradient-to-r from-pink-500 to-rose-600 text-white px-4 py-1.5 rounded-full text-sm font-medium cursor-pointer hover:from-pink-600 hover:to-rose-700 transition-all duration-200 shadow-md hover:shadow-lg transform hover:scale-105"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
          />
        </svg>
        <span>Library</span>
      </button>

      <!-- AI Search Button - Accent Style -->
      <button
        (click)="onAISearchClick()"
        class="flex items-center space-x-2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-4 py-1.5 rounded-full text-sm font-medium cursor-pointer hover:from-indigo-600 hover:to-purple-700 transition-all duration-200 shadow-md hover:shadow-lg transform hover:scale-105"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <span>AI Search</span>
      </button>

      <!-- Upload Button - Primary CTA -->
      <button
        (click)="onUploadClick()"
        class="flex items-center space-x-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-5 py-2 rounded-full text-sm font-semibold cursor-pointer hover:from-emerald-600 hover:to-teal-700 transition-all duration-200 shadow-md hover:shadow-lg transform hover:scale-105 ring-2 ring-emerald-200"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
          />
        </svg>
        <span>Upload</span>
      </button>

      <!-- Divider -->
      <div class="w-px h-8 bg-gray-200"></div>

      <!-- Profile Dropdown -->
      <div class="relative">
        <button
          (click)="onProfileClick()"
          class="relative focus:outline-none group"
        >
          <!-- Loading State -->
          <div
            *ngIf="isLoadingProfile"
            class="h-10 w-10 bg-gray-200 rounded-full flex items-center justify-center animate-pulse"
          >
            <svg
              class="h-5 w-5 text-gray-400"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                clip-rule="evenodd"
              />
            </svg>
          </div>

          <!-- Profile Avatar -->
          <div
            *ngIf="!isLoadingProfile && userProfile"
            class="h-10 w-10 bg-gradient-to-br from-orange-400 to-pink-500 rounded-full flex items-center justify-center text-white font-bold text-sm hover:shadow-lg transition-all duration-200 cursor-pointer transform group-hover:scale-110 ring-2 ring-white shadow-md"
          >
            {{ userInitials }}
          </div>

          <!-- Online indicator -->
          <div
            class="absolute -bottom-0.5 -right-0.5 h-3 w-3 bg-green-400 rounded-full border-2 border-white shadow-sm"
          ></div>
        </button>

        <!-- Dropdown Menu -->
        <div
          *ngIf="showProfileDropdown"
          class="absolute right-0 mt-3 w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 py-6 z-50 transform transition-all duration-200 animate-in slide-in-from-top-2"
        >
          <!-- User Info Section -->
          <div class="px-6 pb-5">
            <div class="flex items-center space-x-4 mb-4">
              <div
                class="h-16 w-16 bg-gradient-to-br from-orange-400 to-pink-500 rounded-2xl flex items-center justify-center text-white font-bold text-xl shadow-lg"
              >
                {{ userInitials }}
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-lg font-bold text-gray-900 truncate mb-1">
                  {{ userProfile?.full_name }}
                </p>
                <p class="text-sm text-gray-500 truncate">
                  {{ userProfile?.email }}
                </p>
                <div class="flex items-center mt-2">
                  <div class="h-2 w-2 bg-green-400 rounded-full mr-2"></div>
                  <span class="text-xs text-green-600 font-medium">Online</span>
                </div>
              </div>
            </div>

            <!-- Credits Display -->
            <div
              class="relative overflow-hidden bg-gradient-to-r from-amber-50 via-yellow-50 to-orange-50 px-5 py-4 rounded-2xl border border-amber-200 shadow-inner"
            >
              <div
                class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-br from-yellow-200/30 to-orange-200/30 rounded-full transform translate-x-8 -translate-y-8"
              ></div>
              <div class="relative flex items-center justify-between">
                <div class="flex items-center space-x-3">
                  <div
                    class="h-10 w-10 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-xl flex items-center justify-center shadow-lg"
                  >
                    <svg
                      class="w-5 h-5 text-white"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                    >
                      <path
                        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                      />
                    </svg>
                  </div>
                  <div>
                    <p class="text-2xl font-bold text-amber-800">
                      {{ credits }}
                    </p>
                    <p class="text-xs text-amber-700 font-medium">
                      Credits remaining
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Sign Out Button -->
          <div class="border-t border-gray-100 pt-4 px-6">
            <button
              (click)="onSignOut()"
              class="flex items-center justify-center cursor-pointer w-full px-4 py-3 text-sm font-semibold text-red-600 hover:bg-red-50 rounded-xl transition-all duration-200 border border-red-100 hover:border-red-200 hover:shadow-md group"
            >
              <svg
                class="w-4 h-4 mr-2 group-hover:scale-110 transition-transform duration-200"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                />
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
