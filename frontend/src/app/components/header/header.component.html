<header class="border-b border-gray-200 py-3 px-4">
    <div class="container mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="h-5 w-5 bg-blue-500 rounded-sm"></div>
            <span class="font-medium">VOICERA</span>
        </div>
        
        <div class="flex items-center space-x-4">
            <!-- Library Button -->
            <button
                (click)="onLibraryClick()"
                class="flex items-center space-x-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-1.5 rounded-full text-sm cursor-pointer hover:from-purple-600 hover:to-blue-600 transition-all duration-200 shadow-sm">
                <div class="flex flex-row items-center gap-x-1 p-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                    <span>Library</span>
                </div>
            </button>

            <!-- AI Search Button -->
            <button
                (click)="onAISearchClick()"
                class="flex items-center space-x-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-1.5 rounded-full text-sm cursor-pointer hover:from-purple-600 hover:to-blue-600 transition-all duration-200 shadow-sm">
                <div class="flex flex-row items-center gap-x-1 p-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <span>AI Search</span>
                </div>
            </button>

            <!-- Upload Button -->
            <button
                (click)="onUploadClick()"
                class="flex items-center space-x-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-1.5 rounded-full text-sm cursor-pointer hover:from-purple-600 hover:to-blue-600 transition-all duration-200 shadow-sm">
                <div class="flex flex-row items-center gap-x-1 p-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    <span>Upload</span>
                </div>
            </button>

            <!-- Profile Dropdown -->
            <div class="relative">
                <button 
                    (click)="onProfileClick()"
                    class="relative focus:outline-none">
                    <!-- Loading State -->
                    <div *ngIf="isLoadingProfile" 
                         class="h-10 w-10 bg-gray-200 rounded-full flex items-center justify-center animate-pulse">
                        <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    
                    <!-- Profile Avatar -->
                    <div *ngIf="!isLoadingProfile && userProfile" 
                         class="h-10 w-10 bg-gradient-to-br from-purple-500 to-blue-500 rounded-full flex items-center justify-center text-white font-semibold text-sm hover:shadow-lg transition-all duration-200 cursor-pointer transform hover:scale-105">
                        {{ userInitials }}
                    </div>
                </button>

                <!-- Simplified Dropdown Menu -->
                <div *ngIf="showProfileDropdown" 
                     class="absolute right-0 mt-2 w-72 bg-white rounded-xl shadow-lg border border-gray-200 py-4 z-50">
                     
                    <!-- User Info Section -->
                    <div class="px-4 pb-4">
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="h-12 w-12 bg-gradient-to-br from-purple-500 to-blue-500 rounded-full flex items-center justify-center text-white font-semibold text-lg">
                                {{ userInitials }}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-base font-semibold text-gray-900 truncate">
                                    {{ userProfile?.full_name }}
                                </p>
                                <p class="text-sm text-gray-500 truncate">
                                    {{ userProfile?.email }}
                                </p>
                            </div>
                        </div>
                        
                        <!-- Credits Display -->
                        <div class="flex items-center justify-center space-x-2 bg-gradient-to-r from-yellow-50 to-orange-50 px-4 py-3 rounded-lg border border-yellow-200">
                            <svg class="w-5 h-5 text-yellow-600" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                            </svg>
                            <span class="text-lg font-bold text-yellow-800">{{ credits }}</span>
                            <span class="text-sm text-yellow-700 font-medium">credits remaining</span>
                        </div>
                    </div>

                    <!-- Sign Out Button -->
                    <div class="border-t border-gray-100 pt-3 px-4">
                        <button 
                            (click)="onSignOut()"
                            class="flex items-center justify-center cursor-pointer w-full px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
