<header class="border-b border-gray-200 py-3 px-4">
    <div class="container mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="h-5 w-5 bg-blue-500 rounded-sm"></div>
            <span class="font-medium">VOICERA</span>
        </div>


        <div class="flex items-center space-x-4">
             <!-- Library Button -->
            <button
                (click)="onLibraryClick()"
                class="flex items-center space-x-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-1.5 rounded-full text-sm cursor-pointer hover:from-purple-600 hover:to-blue-600 transition-all duration-200 shadow-sm">
                <div class="flex flex-row item gap-x-1 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                <span>Library</span>
                </div>
            </button>
             <!-- AI Search Button -->
            <button
                (click)="onAISearchClick()"
                class="flex items-center space-x-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-1.5 rounded-full text-sm cursor-pointer hover:from-purple-600 hover:to-blue-600 transition-all duration-200 shadow-sm">
                <div class="flex flex-row item gap-x-1 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                <span>AI Search</span>
                </div>
            </button>
            
            <!-- Upload Button -->
            <button
                (click)="onUploadClick()"
                class="flex items-center space-x-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-1.5 rounded-full text-sm cursor-pointer hover:from-purple-600 hover:to-blue-600 transition-all duration-200 shadow-sm">
                <div class="flex flex-row item gap-x-1 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                <span>Upload</span>
                </div>
            </button>

            <div class="h-8 w-8 bg-gray-200 rounded-full flex items-center justify-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            </div>
        </div>
    </div>
</header>
