<div class="flex flex-col gap-8">
  <div
    class="overflow-hidden rounded-2xl border border-gray-200/50 bg-white shadow-xl hover:shadow-2xl transition-shadow duration-500"
  >
    <div class="grid p-0 grid-cols-1 md:grid-cols-2">
      <!--  OAuth Login Section -->
      <div
        class="p-6 sm:p-8 md:p-12 flex flex-col justify-center bg-gradient-to-br from-white to-gray-50/50"
      >
        <div class="flex flex-col gap-8 sm:gap-10">
          <!--  Header -->
          <div class="flex flex-col items-center text-center">
            <div class="mb-4 sm:mb-6 relative">
              <!--  Logo with Glow Effect -->
              <div
                class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-indigo-500 via-purple-600 to-indigo-700 rounded-2xl flex items-center justify-center mb-4 sm:mb-6 shadow-2xl relative overflow-hidden group"
              >
                <!-- Glow Effect -->
                <div
                  class="absolute inset-0 bg-gradient-to-br from-indigo-400/50 to-purple-500/50 rounded-2xl blur-xl opacity-60 group-hover:opacity-80 transition-opacity duration-300"
                ></div>
                <!-- Icon -->
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-8 w-8 sm:h-10 sm:w-10 text-white relative z-10 drop-shadow-lg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
                  />
                </svg>
                <!-- Subtle Animation -->
                <div
                  class="absolute inset-0 bg-white/20 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                ></div>
              </div>
            </div>
            <h1
              class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent mb-2 sm:mb-3"
            >
              Welcome to VOICERA
            </h1>
            <p class="text-gray-600 text-base sm:text-lg">
              Sign in to continue your audio journey
            </p>
          </div>

          <!--  OAuth Buttons -->
          <div class="flex flex-col gap-4 sm:gap-5">
            <!--  Google Sign In -->
            <button
              type="button"
              (click)="oauthSignIn('google')"
              class="group relative inline-flex items-center justify-center whitespace-nowrap rounded-xl border border-gray-200 bg-white px-6 sm:px-8 py-3 sm:py-4 text-sm sm:text-base font-medium shadow-lg transition-all duration-300 hover:bg-gray-50 hover:border-gray-300 hover:shadow-xl hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 disabled:pointer-events-none disabled:opacity-50 w-full cursor-pointer overflow-hidden"
            >
              <!-- Hover Effect Background -->
              <div
                class="absolute inset-0 bg-gradient-to-r from-blue-50 to-indigo-50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              ></div>

              <!-- Google Icon with Styling -->
              <div class="relative z-10 flex items-center">
                <div class="w-5 h-5 sm:w-6 sm:h-6 mr-3 sm:mr-4 relative">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    class="w-full h-full"
                  >
                    <path
                      d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"
                      fill="#4285F4"
                    />
                  </svg>
                </div>
                <span
                  class="text-gray-700 group-hover:text-gray-900 font-medium"
                  >Continue with Google</span
                >
              </div>

              <!-- Subtle Arrow -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 sm:h-5 sm:w-5 ml-auto text-gray-400 group-hover:text-gray-600 group-hover:translate-x-1 transition-all duration-300 relative z-10"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>

            <!--  GitHub Sign In -->
            <button
              type="button"
              (click)="oauthSignIn('github')"
              class="group relative inline-flex items-center justify-center whitespace-nowrap rounded-xl border border-gray-200 bg-white px-6 sm:px-8 py-3 sm:py-4 text-sm sm:text-base font-medium shadow-lg transition-all duration-300 hover:bg-gray-50 hover:border-gray-300 hover:shadow-xl hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 disabled:pointer-events-none disabled:opacity-50 w-full cursor-pointer overflow-hidden"
            >
              <!-- Hover Effect Background -->
              <div
                class="absolute inset-0 bg-gradient-to-r from-gray-50 to-slate-50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              ></div>

              <!-- GitHub Icon with Styling -->
              <div class="relative z-10 flex items-center">
                <div class="w-5 h-5 sm:w-6 sm:h-6 mr-3 sm:mr-4 relative">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    class="w-full h-full"
                    fill="#24292e"
                  >
                    <path
                      d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
                    />
                  </svg>
                </div>
                <span
                  class="text-gray-700 group-hover:text-gray-900 font-medium"
                  >Continue with GitHub</span
                >
              </div>

              <!-- Subtle Arrow -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 sm:h-5 sm:w-5 ml-auto text-gray-400 group-hover:text-gray-600 group-hover:translate-x-1 transition-all duration-300 relative z-10"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>

            <!-- Divider -->
            <div class="relative my-3 sm:my-4">
              <div class="absolute inset-0 flex items-center">
                <span class="w-full border-t border-gray-200"></span>
              </div>
              <div class="relative flex justify-center text-sm">
                <span class="bg-gray-50 px-4 text-gray-500 font-medium"
                  >or</span
                >
              </div>
            </div>

            <!--  Guest Sign In -->
            <button
              type="button"
              (click)="guestSignIn()"
              [disabled]="isGuestLoading"
              class="group relative inline-flex items-center justify-center whitespace-nowrap rounded-xl border-2 border-dashed border-indigo-300 bg-gradient-to-br from-indigo-50 to-purple-50 px-6 sm:px-8 py-3 sm:py-4 text-sm sm:text-base font-medium shadow-lg transition-all duration-300 hover:border-indigo-400 hover:from-indigo-100 hover:to-purple-100 hover:shadow-xl hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 disabled:pointer-events-none disabled:opacity-50 w-full cursor-pointer overflow-hidden"
            >
              <!-- Shimmer Effect -->
              <div
                class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent opacity-0 group-hover:opacity-100 translate-x-[-100%] group-hover:translate-x-[100%] transition-all duration-700"
              ></div>

              <!-- Guest Icon with Styling -->
              <div class="relative z-10 flex items-center">
                <div
                  class="w-5 h-5 sm:w-6 sm:h-6 mr-3 sm:mr-4 relative flex items-center justify-center"
                >
                  <!-- Guest User Icon -->
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-full h-full text-indigo-600"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                    />
                  </svg>
                  <!-- Loading Spinner (hidden by default) -->
                  <svg
                    *ngIf="isGuestLoading"
                    class="absolute inset-0 w-full h-full text-indigo-600 animate-spin"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                  >
                    <circle
                      class="opacity-25"
                      cx="12"
                      cy="12"
                      r="10"
                      stroke="currentColor"
                      stroke-width="4"
                    ></circle>
                    <path
                      class="opacity-75"
                      fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                    ></path>
                  </svg>
                </div>
                <span
                  class="text-indigo-700 group-hover:text-indigo-800 font-medium"
                >
                  {{ isGuestLoading ? "Signing in..." : "Continue as Guest" }}
                </span>
              </div>

              <!-- Subtle Arrow -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 sm:h-5 sm:w-5 ml-auto text-indigo-500 group-hover:text-indigo-700 group-hover:translate-x-1 transition-all duration-300 relative z-10"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Image Section -->
      <div
        class="relative hidden bg-gradient-to-br from-gray-100 to-gray-200 md:block overflow-hidden"
      >
        <!-- Overlay for better contrast -->
        <div
          class="absolute inset-0 bg-gradient-to-br from-indigo-900/20 to-purple-900/20 z-10"
        ></div>
        <img
          src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Audio Discovery Interface"
          class="absolute inset-0 h-full w-full object-cover transition-transform duration-700 hover:scale-105 dark:brightness-[0.3]"
        />

        <div class="absolute bottom-6 sm:bottom-8 left-6 sm:left-8 right-6 sm:right-8 z-20">
          <div
            class="bg-white/10 backdrop-blur-md rounded-2xl p-5 sm:p-6 border border-white/20"
          >
            <h3 class="text-white text-lg font-semibold mb-2">
              AI-Powered Audio Search
            </h3>
            <p class="text-white/80 text-sm">
              Transform your audio content into searchable, organized knowledge.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
