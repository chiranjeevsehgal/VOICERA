<div
  class="group bg-white rounded-2xl shadow-sm hover:shadow-md transition-transform duration-300 cursor-pointer overflow-hidden border border-gray-200 h-full flex flex-col hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
  (click)="onCardClick()"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Open ' + podcast.title"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick(); $event.preventDefault()"
>
  <!-- Image Container with Enhanced Hover Effects -->
  <div class="relative overflow-hidden aspect-square">
    <!-- Background Gradient -->
    <div
      class="absolute inset-0 bg-gradient-to-br from-indigo-500/10 to-indigo-600/10"
    ></div>

    <!-- Main Image -->
    <img
      [src]="podcast.imageUrl"
      [alt]="podcast.title"
      class="w-full h-full object-cover group-hover:scale-105 group-hover:brightness-75 transition-transform duration-300"
    />

    <!-- Overlay with Play Button -->
    <div
      class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-200"
    >
      <!-- Play Button -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div
          class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md transition-transform duration-200 group-hover:scale-105"
        >
          <svg
            class="w-5 h-5 text-indigo-600 ml-0.5"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M8 5v14l11-7z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Category Tag -->
    <div
      *ngIf="podcast.category"
      class="absolute top-4 left-4 bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wide"
    >
      {{ podcast.category }}
    </div>
  </div>

  <!-- Content Section -->
  <div class="p-6 flex-1 flex flex-col">
    <!-- Title - This will grow/shrink as needed -->
    <h3
      class="text-base md:text-lg font-semibold text-gray-900 mb-2 leading-tight group-hover:text-indigo-600 transition-colors duration-200 flex-1 break-words"
    >
      {{ podcast.title }}
    </h3>

    <!-- Bottom Content - Always at bottom -->
    <div class="mt-auto">
      <!-- Creator Info -->
      <div class="flex items-center gap-3 mb-4">
        <div
          class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-semibold text-sm"
        >
          {{ podcast.creator?.charAt(0) }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-700 truncate">
            {{ podcast.creator }}
          </p>
          <p class="text-xs text-gray-500">
            {{ podcast?.audioFile?.created_at | date: "MMM d, y" }}
          </p>
        </div>
      </div>

      <!-- Stats Row -->
      <div
        *ngIf="podcast.plays || podcast.likes"
        class="flex items-center justify-between text-xs text-gray-500 pt-3 border-t border-gray-100"
      >
        <div *ngIf="podcast.plays" class="flex items-center gap-1">
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15.536 12.207a5.5 5.5 0 010-7.414l2.121-2.121a5.5 5.5 0 017.778 7.778l-2.121 2.121a5.5 5.5 0 01-7.778 0z"
            ></path>
          </svg>
          <span>{{ podcast.plays }} plays</span>
        </div>
        <div *ngIf="podcast.likes" class="flex items-center gap-1">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
          <span>{{ podcast.likes }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
