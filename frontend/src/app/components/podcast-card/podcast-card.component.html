<div class="flex flex-col">
    <div class="relative aspect-square bg-gray-100 rounded-md overflow-hidden mb-2 text-black">
        <img [src]="podcast.imageUrl" [alt]="podcast.title" class="w-full h-full object-cover" />
    </div>
    <h3 class="font-medium text-sm line-clamp-1">{{ podcast.title }}</h3>
    <p class="text-xs text-gray-600 line-clamp-1">{{ podcast.creator }}</p>
</div>
