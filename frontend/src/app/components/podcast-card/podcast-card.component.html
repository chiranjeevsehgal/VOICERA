<div class="group bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-500 cursor-pointer overflow-hidden border border-gray-100 h-full flex flex-col"
     (click)="onCardClick()">
  
  <!-- Image Container with Enhanced Hover Effects -->
  <div class="relative overflow-hidden aspect-square">
    <!-- Background Gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/20 to-purple-600/20"></div>
    
    <!-- Main Image -->
    <img 
      [src]="podcast.imageUrl" 
      [alt]="podcast.title"
      class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700">
    
    <!-- Overlay with Play Button -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300">
      <!-- Play Button -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-2xl transform scale-75 group-hover:scale-100 transition-all duration-300">
          <svg class="w-6 h-6 text-indigo-600 ml-1" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>
      
    </div>

    <!-- Category Tag -->
    <div *ngIf="podcast.category" class="absolute top-4 left-4 bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wide">
      {{ podcast.category}}
    </div>
  </div>
  
  <!-- Content Section -->
  <div class="p-6 flex-1 flex flex-col">
    <!-- Title - This will grow/shrink as needed -->
    <h3 class="font-bold text-gray-900 mb-3 text-lg leading-tight line-clamp-2 group-hover:text-indigo-600 transition-colors duration-300 flex-1">
      {{ podcast.title }}
    </h3>
    
    <!-- Bottom Content - Always at bottom -->
    <div class="mt-auto">
      <!-- Creator Info -->
      <div class="flex items-center gap-3 mb-4">
        <div class="w-8 h-8 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-full flex items-center justify-center text-white font-semibold text-sm">
          {{ podcast.creator?.charAt(0)}}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-700 truncate">{{ podcast.creator }}</p>
          <p class="text-xs text-gray-500">{{ podcast?.audioFile?.created_at | date:'MMM d, y' }}</p>
        </div>
      </div>

      <!-- Stats Row -->
      <div *ngIf="podcast.plays || podcast.likes" class="flex items-center justify-between text-xs text-gray-500 pt-3 border-t border-gray-100">
        <div *ngIf="podcast.plays" class="flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 12.207a5.5 5.5 0 010-7.414l2.121-2.121a5.5 5.5 0 017.778 7.778l-2.121 2.121a5.5 5.5 0 01-7.778 0z"></path>
          </svg>
          <span>{{ podcast.plays}} plays</span>
        </div>
        <div *ngIf="podcast.likes" class="flex items-center gap-1">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span>{{ podcast.likes}}</span>
      </div>
    </div>
  </div>
</div>
