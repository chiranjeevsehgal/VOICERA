<section class="mt-8 mb-10">
  <h1 class="text-2xl font-bold mb-6 text-black">Search and explore audio</h1>
  <div class="max-w-full relative">
    <input
      type="text"
      placeholder="Search by title or creator name..."
      [(ngModel)]="searchQuery"
      (input)="onSearchInput()"
      (keyup.enter)="onSubmit()"
      class="w-full px-4 py-2.5 pr-10 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-black"
    />
    <!-- Clear button -->
    <button
      *ngIf="searchQuery"
      (click)="onSearchClear()"
      class="absolute right-3 top-1/2 cursor-pointer transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
      aria-label="Clear search"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>
    <!-- Search icon -->
    <div
      *ngIf="!searchQuery"
      class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        ></path>
      </svg>
    </div>
  </div>
</section>
