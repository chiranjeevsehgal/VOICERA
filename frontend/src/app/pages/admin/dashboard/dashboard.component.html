<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
  
  <!-- Sidebar Component -->
  <app-sidebar 
    [isOpen]="isSidebarOpen"
    [isMobile]="isMobile"
    (itemSelected)="onSidebarItemSelected($event)"
    (sidebarToggle)="toggleSidebar()"
  ></app-sidebar>

  <!-- Main Content Area -->
  <div 
    class="transition-all duration-300 ease-in-out"
    [ngClass]="{
      'lg:ml-64': !isMobile,
      'ml-0': isMobile
    }"
  >
    <!-- Top Header with Hamburger Menu -->
    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-30">
      <div class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16 sm:h-20">
        
        <!-- Left Side: Hamburger + Page Info -->
        <div class="flex items-center space-x-4">
          <!-- Hamburger Menu (Mobile + Desktop Toggle) -->
          <button
            (click)="toggleSidebar()"
            class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gradient-to-r hover:from-indigo-50 hover:to-purple-50 flex items-center justify-center transition-all duration-200 hover:shadow-md border border-gray-200 hover:border-indigo-200 group"
          >
            <div class="space-y-1.5">
              <div 
                class="w-5 h-0.5 bg-gray-600 group-hover:bg-indigo-600 transition-all duration-200 transform origin-center"
                [ngClass]="{ 'rotate-45 translate-y-2': isSidebarOpen && isMobile, 'rotate-0': !isSidebarOpen || !isMobile }"
              ></div>
              <div 
                class="w-5 h-0.5 bg-gray-600 group-hover:bg-indigo-600 transition-all duration-200"
                [ngClass]="{ 'opacity-0': isSidebarOpen && isMobile, 'opacity-100': !isSidebarOpen || !isMobile }"
              ></div>
              <div 
                class="w-5 h-0.5 bg-gray-600 group-hover:bg-indigo-600 transition-all duration-200 transform origin-center"
                [ngClass]="{ '-rotate-45 -translate-y-2': isSidebarOpen && isMobile, 'rotate-0': !isSidebarOpen || !isMobile }"
              ></div>
            </div>
          </button>

          <!-- Page Title & Breadcrumb -->
          <div class="hidden sm:block">
            <h1 class="text-xl lg:text-2xl font-bold text-gray-900 flex items-center space-x-3">
              <span>{{ getPageTitle() }}</span>
            </h1>
          </div>
        </div>

        <!-- Right Side: Actions & Profile -->
        <div class="flex items-center space-x-3 sm:space-x-4">

          <!-- Profile Menu -->
          <div class="relative">
            <button class="flex items-center space-x-2 sm:space-x-3 px-2 sm:px-3 py-2 rounded-xl hover:bg-gray-50 transition-all duration-200 border border-gray-200 hover:border-indigo-200 hover:shadow-sm group">
              <div class="w-8 h-8 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center shadow-sm">
                <span class="text-white text-sm font-bold">A</span>
              </div>
              <div class="hidden sm:block text-left">
                <p class="text-sm font-semibold text-gray-900">Admin</p>
                <p class="text-xs text-gray-500">Super Admin</p>
              </div>
              <svg class="w-4 h-4 text-gray-500 group-hover:text-indigo-600 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Page Title -->
      <div class="sm:hidden px-4 pb-4">
        <h1 class="text-lg font-bold text-gray-900 flex items-center space-x-2">
          
          <span>{{ getPageTitle() }}</span>
        </h1>
        <p class="text-sm text-gray-600 mt-1">{{ getPageDescription() }}</p>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-auto">
      <!-- Content Area -->
      <div class="px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Dynamic Content Based on Selected View -->
        <div class="bg-white rounded-2xl sm:rounded-3xl shadow-sm border border-gray-100 p-6 sm:p-8">
          <!-- Placeholder Content - This will be replaced with actual components -->
          <div class="text-center py-12 sm:py-20">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
              <svg class="w-8 h-8 sm:w-10 sm:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getPageIcon()"/>
              </svg>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4">{{ getPageTitle() }}</h2>
            <p class="text-gray-600 text-lg mb-8 max-w-md mx-auto">{{ getPageDescription() }}</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
