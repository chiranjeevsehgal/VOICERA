<div
  class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50"
>
  <!-- Sidebar Component -->
  <app-sidebar
    [isOpen]="isSidebarOpen"
    [isMobile]="isMobile"
    [currentView]="currentView"
    (itemSelected)="onSidebarItemSelected($event)"
    (sidebarToggle)="toggleSidebar()"
  ></app-sidebar>

  <!-- Main Content Area -->
  <div
    class="transition-all duration-300 ease-in-out"
    [ngClass]="{
      'lg:ml-64': !isMobile,
      'ml-0': isMobile
    }"
  >
    <!-- Top Header with Hamburger Menu -->
    <header
      class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-30 items-center"
    >
      <div
        class="flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16 sm:h-20"
      >
        <!-- Left Side: Hamburger + Page Info -->
        <div class="flex items-center space-x-4">
          <!-- Hamburger Menu (Mobile + Desktop Toggle) -->
          <button
            (click)="toggleSidebar()"
            class="lg:hidden w-10 h-10 cursor-pointer rounded-xl bg-gray-100 hover:bg-gradient-to-r hover:from-indigo-50 hover:to-purple-50 flex items-center justify-center transition-all duration-200 hover:shadow-md border border-gray-200 hover:border-indigo-200 group"
          >
            <div class="space-y-1.5">
              <div
                class="w-5 h-0.5 bg-gray-600 group-hover:bg-indigo-600 transition-all duration-200 transform origin-center"
                [ngClass]="{
                  'rotate-45 translate-y-2': isSidebarOpen && isMobile,
                  'rotate-0': !isSidebarOpen || !isMobile
                }"
              ></div>
              <div
                class="w-5 h-0.5 bg-gray-600 group-hover:bg-indigo-600 transition-all duration-200"
                [ngClass]="{
                  'opacity-0': isSidebarOpen && isMobile,
                  'opacity-100': !isSidebarOpen || !isMobile
                }"
              ></div>
              <div
                class="w-5 h-0.5 bg-gray-600 group-hover:bg-indigo-600 transition-all duration-200 transform origin-center"
                [ngClass]="{
                  '-rotate-45 -translate-y-2': isSidebarOpen && isMobile,
                  'rotate-0': !isSidebarOpen || !isMobile
                }"
              ></div>
            </div>
          </button>

          <!-- Page Title & Breadcrumb -->
          <div class="hidden sm:block">
            <h1
              class="text-xl lg:text-2xl font-bold text-gray-900 flex items-center space-x-3"
            >
              <span>{{ getPageTitle() }}</span>
            </h1>
          </div>
        </div>

        <!-- Right Side: Actions & Profile -->
        <div class="flex items-center space-x-3 sm:space-x-4">
          <!-- Profile Menu -->
          <div class="relative">
            <div
              class="flex items-center space-x-2 sm:space-x-3 px-2 sm:px-3 py-2 rounded-xl transition-all duration-200 group"
            >
              <div
                class="w-8 h-8 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full flex items-center justify-center shadow-sm"
              >
                <span class="text-white text-sm font-bold">{{
                  userInitials
                }}</span>
              </div>
              <div class="hidden sm:block text-left" *ngIf="!isLoadingProfile">
                <p class="text-sm font-semibold text-gray-900">
                  {{ userProfile?.full_name || "Admin" }}
                </p>
                <p class="text-xs text-gray-500">
                  {{ userProfile?.email || "admin@example.com" }}
                </p>
              </div>
              <!-- Loading state -->
              <div class="hidden sm:block text-left" *ngIf="isLoadingProfile">
                <div
                  class="w-20 h-4 bg-gray-200 rounded animate-pulse mb-1"
                ></div>
                <div class="w-24 h-3 bg-gray-200 rounded animate-pulse"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Page Title -->
      <div class="sm:hidden px-4 pb-4">
        <h1 class="text-lg font-bold text-gray-900 flex items-center space-x-2">
          <span>{{ getPageTitle() }}</span>
        </h1>
        <!-- <p class="text-sm text-gray-600 mt-1">{{ getPageDescription() }}</p> -->
      </div>
    </header>

    <!-- Replace the placeholder content section with this -->
    <main class="flex-1 overflow-auto">
      <!-- Content Area -->
      <div class="px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Dynamic Content Based on Selected View -->
        <div
          class="bg-white rounded-2xl sm:rounded-3xl shadow-sm border border-gray-100 p-6 sm:p-8"
        >
          <!-- Dashboard Overview -->
          <!-- <app-dashboard-overview *ngIf="currentView === 'dashboard'"></app-dashboard-overview> -->

          <!-- User Management -->
          <app-user-management
            *ngIf="currentView === 'user-management'"
          ></app-user-management>
          
          <!-- Credit Management -->
          <app-credit-management
            *ngIf="currentView === 'credit-management'"
          ></app-credit-management>

          <!-- Audio Management -->
          <app-audio-management *ngIf="currentView === 'audio-management'"></app-audio-management>
        </div>
      </div>
    </main>
  </div>
</div>
