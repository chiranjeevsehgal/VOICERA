<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
  <app-header></app-header>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6">AI Answer</h1>

    <section class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-800">Query</h2>
      <p class="text-gray-700 mt-1">{{ searchQuery }}</p>

      <div class="mt-4 text-sm text-gray-500" *ngIf="title">
        <span class="font-medium text-gray-700">From:</span> {{ title }}
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 mb-6">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-800">Transcript</h2>
        <span class="text-sm text-gray-500" *ngIf="loadingTranscript">Loading...</span>
      </div>
      <div class="mt-3">
        <pre class="whitespace-pre-wrap text-gray-700 text-sm bg-gray-50 p-4 rounded-xl max-h-80 overflow-y-auto" *ngIf="!loadingTranscript && transcript; else noTranscript">{{ transcript }}</pre>
        <ng-template #noTranscript>
          <p class="text-gray-500">Transcript unavailable.</p>
        </ng-template>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-800">AI Answer</h2>
        <span class="text-sm text-gray-500" *ngIf="loadingAnswer">Thinking...</span>
      </div>

      <div class="mt-3" *ngIf="!loadingAnswer && answer; else noAnswer">
        <p class="text-gray-800 leading-relaxed">{{ answer!.answer }}</p>
        <div class="text-xs text-gray-500 mt-3">
          <span>Model: {{ answer!.model || 'unknown' }}</span>
          <span class="ml-3">Result ID: {{ answer!.result_id }}</span>
        </div>
      </div>
      <ng-template #noAnswer>
        <p class="text-gray-500" *ngIf="!loadingAnswer && !error">No answer yet.</p>
      </ng-template>

      <div *ngIf="error" class="mt-3 text-sm text-red-600">{{ error }}</div>
    </section>
  </main>
</div>
