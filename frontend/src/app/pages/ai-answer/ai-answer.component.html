<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
  <app-header></app-header>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900">AI Chat</h1>
      <p class="text-gray-600 mt-1">Ask questions about this audio's transcript and continue the conversation.</p>
      <div class="mt-2 text-sm text-gray-500" *ngIf="title">
        <span class="font-medium text-gray-700">From:</span> {{ title }}
      </div>
      <div class="mt-1 text-xs text-gray-500" *ngIf="loadingTranscript">Loading transcript...</div>
    </div>

    <section class="bg-white rounded-2xl shadow-lg border border-gray-100 p-0 overflow-hidden">
      <!-- Messages -->
      <div #scrollContainer class="px-4 py-6 space-y-8" style="min-height: 50vh; max-height: 65vh; overflow-y: auto;">
        <div *ngFor="let m of messages; let i = index">

          <!-- Assistant message -->
          <div *ngIf="m.role === 'assistant'" class="flex items-start gap-3">
            <div class="h-8 w-8 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-semibold">AI</div>
            <div class="max-w-[80%] bg-gray-100 text-gray-900 px-4 py-3 rounded-2xl rounded-tl-sm whitespace-pre-line">{{ m.content }}</div>
          </div>

          <!-- User message -->
          <div *ngIf="m.role === 'user'" class="flex items-start gap-3 justify-end">
            <div class="max-w-[80%] bg-indigo-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm whitespace-pre-line">{{ m.content }}</div>
            <div class="h-8 w-8 rounded-full bg-gray-200 text-gray-700 flex items-center justify-center text-xs font-semibold">You</div>
          </div>
        </div>

        <!-- Typing indicator -->
        <div *ngIf="loadingAnswer" class="flex items-center gap-2 text-sm text-gray-500">
          <span class="h-2 w-2 rounded-full bg-gray-400 animate-pulse"></span>
          <span>Thinking...</span>
        </div>

        <!-- Error -->
        <div *ngIf="error" class="text-sm text-red-600">{{ error }}</div>
      </div>

      <!-- Composer -->
      <form class="border-t border-gray-100 p-4 bg-white" (ngSubmit)="send()">
        <div class="flex items-end gap-3">
          <textarea
            class="flex-1 resize-none rounded-xl border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            rows="1"
            placeholder="Type your message..."
            [(ngModel)]="userInput"
            name="chatInput"
            [disabled]="sending || loadingTranscript"
            (keydown.enter)="send(); $event.preventDefault()"
          ></textarea>
          <button
            type="submit"
            class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl disabled:opacity-50"
            [disabled]="sending || loadingTranscript || !userInput.trim()"
          >
            <span *ngIf="!sending">Send</span>
            <span *ngIf="sending">Sending...</span>
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
