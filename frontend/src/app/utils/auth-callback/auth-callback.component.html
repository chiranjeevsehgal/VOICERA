<!-- auth-callback.component.html -->
<div class="min-h-screen bg-gradient-to-br from-purple-600 via-blue-600 to-indigo-800 flex items-center justify-center relative overflow-hidden">
  
  <!-- Animated Background Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-white/10 rounded-full blur-xl animate-pulse"></div>
    <div class="absolute top-3/4 right-1/4 w-96 h-96 bg-purple-300/10 rounded-full blur-2xl animate-bounce"></div>
    <div class="absolute bottom-1/4 left-1/2 w-48 h-48 bg-blue-300/10 rounded-full blur-xl animate-ping"></div>
  </div>

  <div class="relative z-10 text-center max-w-md mx-auto px-6">
    
    <!-- Logo Section -->
    <div class="mb-8 animate-fade-in-up">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4 backdrop-blur-sm">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">VOICERA</h1>
      <p class="text-purple-100 text-sm">Future of Audio Discovery</p>
    </div>

    <!-- Loading Animation -->
    <div class="mb-8">
      <div class="relative">
        <!-- Spinning Rings -->
        <div class="flex items-center justify-center">
          <div class="relative">
            <div class="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
            <div class="absolute top-2 left-2 w-12 h-12 border-4 border-purple-300/50 border-t-purple-200 rounded-full animate-spin animation-delay-150"></div>
            <div class="absolute top-4 left-4 w-8 h-8 border-4 border-blue-300/50 border-t-blue-200 rounded-full animate-spin animation-delay-300"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dynamic Messages -->
    <div class="mb-8 space-y-2">
      <h2 class="text-xl font-semibold text-white animate-pulse">{{ currentMessage }}</h2>
      <p class="text-purple-100 text-sm">{{ subMessage }}</p>
    </div>

    <!-- Fun Footer Message -->
    <div class="mt-8 text-purple-200 text-xs animate-bounce">
      ✨ Crafting your personalized experience...
    </div>
  </div>
</div>
